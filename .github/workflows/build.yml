name: Windows Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows (Electron & Tauri)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Get version from package.json
        id: pkg
        run: node -p "\"version=\" + require('./package.json').version" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install Dependencies
        run: npm install

      # 1. Electron Packaging & Make
      - name: Package Electron Application
        run: npm run package

      - name: Make Electron Distributables
        run: npm run make -- --skip-package

      # 2. Tauri Packaging
      - name: Build Frontend for Tauri
        run: npm run build:vite

      - name: Build Tauri Bundles
        run: npx tauri build
        env:
          CI: true

      # 3. Upload Artifacts to Action Run
      - name: Upload Windows Distributables
        uses: actions/upload-artifact@v4
        with:
          name: QuickPill-Windows-v${{ steps.pkg.outputs.version }}
          path: |
            out/make/**/*.exe
            out/make/**/*.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # 4. GitHub Release on Push to Main/Master
      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Quick Pill v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            out/make/**/*.exe
            out/make/**/*.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}