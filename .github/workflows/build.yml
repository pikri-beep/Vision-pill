name: Windows Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows (Electron)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get version from package.json
        id: pkg
        run: node -p "\"version=\" + require('./package.json').version" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install Dependencies
        run: npm install

      # 1. Electron Packaging & Make
      - name: Package Electron Application
        run: npm run package

      - name: Make Electron Distributables
        run: npm run make -- --skip-package

      - name: Build Optimized NSIS Installer
        run: npx electron-builder --win --x64

      # 2. Upload Artifacts to Action Run
      - name: Upload Windows Distributables
        uses: actions/upload-artifact@v4
        with:
          name: QuickPill-Windows-v${{ steps.pkg.outputs.version }}
          path: |
            dist/*.exe
            out/make/**/*.exe
            out/make/**/*.zip
          if-no-files-found: warn

      # 3. GitHub Release on Push to Main/Master
      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Quick Pill v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            out/make/**/*.exe
            out/make/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
